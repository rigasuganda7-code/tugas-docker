
services:
  # ==========================================
  # 1. DATABASE SQL & NOSQL
  # ==========================================
  mysql_db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tugas2_db
    ports:
      - "3306:3306"

  postgres_db:
    image: postgres:15
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: tugas2_db
    ports:
      - "5432:5432"

  mongo_db:
    image: mongo:latest
    ports:
      - "27017:27017"

  # ==========================================
  # 2. WEB SERVICE / API (PHP & PYTHON)
  # ==========================================
  php_api:
    image: php:8.2-apache
    ports:
      - "8080:80"

  python_api:
    image: python:3.10-slim
    command: python -m http.server 8000
    ports:
      - "8081:8000"

  # ==========================================
  # 3. FRONTEND (NODE.JS)
  # ==========================================
  nodejs_frontend:
    image: node:18-alpine
    # Command ini menjaga container Node.js tetap running meskipun belum ada kode aplikasi
    command: sh -c "echo 'Node.js Frontend siap' && tail -f /dev/null"
    ports:
      - "3000:3000"

  # ==========================================
  # 4. DATABASE UI (phpMyAdmin, pgAdmin, Mongo Express)
  # ==========================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql_db
      PMA_PORT: 3306
    ports:
      - "8082:80"
    depends_on:
      - mysql_db

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: rootpassword
    ports:
      - "8083:80"
    depends_on:
      - postgres_db

  mongo_express:
    image: mongo-express
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo_db:27017/
    ports:
      - "8084:8081"
    depends_on:
      - mongo_db

  # ==========================================
  # 5. SUPPORT WEBSOCKET, MQTT, RABBITMQ
  # ==========================================
  websocket_server:
    image: jmalloc/echo-server
    ports:
      - "8085:8080" # Echo server ini mendukung koneksi HTTP dan WebSocket

  mqtt_broker:
    # Menggunakan versi 1.6 agar tidak memerlukan konfigurasi tambahan untuk anonymous login
    image: eclipse-mosquitto:1.6.15
    ports:
      - "1883:1883"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"   # Port utama RabbitMQ
      - "15672:15672" # Port UI Management RabbitMQ